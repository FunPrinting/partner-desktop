<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https:">
  <title>Order</title>
  <link rel="stylesheet" href="src/ui/styles.css">
  <style>
    body { overflow: auto; }
    .order { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 20px; padding: 24px; min-height: 100vh; }
    .kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 18px; }
    .kv + .kv { border-top: 1px solid var(--border); }
    .kv dt { color: var(--text-3); }
    .kv dd { margin: 0; font-weight: 550; text-align: right; overflow-wrap: anywhere; }
    .preview { display: flex; flex-direction: column; min-height: 520px; }
    .preview iframe, .preview img { flex: 1; width: 100%; border: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); background: var(--surface-muted); object-fit: contain; }
    .files { display: flex; gap: 6px; flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    dl { margin: 0; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
  </svg>

  <div class="order">
    <div class="stack">
      <div>
        <h1 style="font-size:22px" id="title">Order</h1>
        <div style="display:flex;gap:8px;margin-top:6px" id="pills"></div>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-title">Order</span></div>
        <dl class="card" id="summary"></dl>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-title">Customer</span></div>
        <dl class="card" id="customer"></dl>
      </div>

      <div class="section">
        <div class="section-head"><span class="section-title">Update status</span></div>
        <div class="card card-pad">
          <div id="status-actions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <p class="hint">To refuse an order, decline it on the Jobs page; the customer is refunded.</p>
        </div>
      </div>

      <div id="message"></div>
    </div>

    <div class="card preview">
      <div class="card-pad" style="flex-direction:row;align-items:center;justify-content:space-between;gap:12px">
        <div style="min-width:0">
          <div class="row-title" id="doc-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
          <div class="files" id="doc-files"></div>
        </div>
        <div class="actions">
          <button class="btn" id="download-btn"><svg class="icon icon-sm"><use href="#i-download"/></svg>Download</button>
          <button class="btn btn-primary" id="print-again-btn"><svg class="icon icon-sm"><use href="#i-printer"/></svg>Print again here</button>
        </div>
      </div>
      <div id="preview" style="flex:1;display:flex"></div>
    </div>
  </div>

  <dialog class="modal" id="dialog"><form method="dialog">
    <div class="modal-body"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div id="dialog-input-wrap" class="field hidden"><label for="dialog-input" id="dialog-input-label"></label><input class="input" id="dialog-input"></div></div>
    <div class="modal-foot"><button class="btn" value="cancel" id="dialog-cancel">Cancel</button><button class="btn btn-primary" value="ok" id="dialog-ok">OK</button></div>
  </form></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="src/ui/util.js"></script>
  <script src="src/ui/orderWindow.js"></script>
</body>
</html>

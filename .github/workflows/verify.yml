name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Print engine tests (Rust)
        run: npm run test:native
      - name: Build the Windows print engine
        if: matrix.os == 'windows-latest'
        run: npm run build:native
      - name: Print a test document through the Windows engine
        if: matrix.os == 'windows-latest'
        run: npm run smoke:print
      - name: Add a network printer through the Windows engine and print to it
        timeout-minutes: 8
        if: matrix.os == 'windows-latest'
        run: npm run smoke:add
      - name: Start the printing system (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sudo launchctl enable system/org.cups.cupsd || true
          sudo launchctl kickstart -k system/org.cups.cupsd || true
          sleep 2
          lpstat -r || true
      - name: Start the printing system and a virtual display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cups cups-ipp-utils xvfb
          sudo systemctl start cups
          lpstat -r
      - name: Package the app and check the installed build sees printers
        timeout-minutes: 15
        shell: bash
        run: |
          npx electron-builder --dir --publish never
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run check:packaged; else npm run check:packaged; fi

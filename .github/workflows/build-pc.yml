name: Build PC Partner App (Electron)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Trigger only when a new release tag like 'v1.0.0' is pushed

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: partner-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Windows Executable
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for electron-builder

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: partner-app/dist/*.exe
          generate_release_notes: true
